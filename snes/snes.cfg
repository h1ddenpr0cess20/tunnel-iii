MEMORY {
    ZP:    start = $0000, size = $0100, type = rw;
    RAM:   start = $0100, size = $1E00, type = rw;
    ROM0:  start = $808000, size = $7FB0, fill = yes, fillval = $FF, file = %O;
    HDR:   start = $80FFB0, size = $0050, fill = yes, fillval = $00, file = %O;
    ROM1:  start = $818000, size = $8000, fill = yes, fillval = $FF, file = %O;
    ROM2:  start = $828000, size = $8000, fill = yes, fillval = $FF, file = %O;
    ROM3:  start = $838000, size = $8000, fill = yes, fillval = $FF, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    BSS:      load = RAM,  type = bss, align = 2;
    CODE:     load = ROM0, type = ro;
    RODATA:   load = ROM0, type = ro;
    HEADER:   load = HDR,  type = ro, start = $80FFB0;
    BANK1:    load = ROM1, type = ro;
    BANK2:    load = ROM2, type = ro;
    BANK3:    load = ROM3, type = ro;
}
